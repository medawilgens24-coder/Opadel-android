name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare app icon assets
        run: |
          mkdir -p assets
          cp www/opadel-logo.png assets/icon-only.png
          cp www/opadel-logo.png assets/icon-foreground.png
          cp www/opadel-logo.png assets/icon-background.png

      - name: Generate Android icons
        run: |
          npx -y @capacitor/assets@3.0.5 generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opadel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
